        .mainDiv {

    <script>

        $(document).ready(function () {

            const togglePassword = document.querySelector("#togglePassword");
            const password = document.querySelector("#password");
            const confirmPassword = document.querySelector("#confirmPassword");
            const button = document.querySelector("#submitButton");
            const child = document.querySelector("#child");

            togglePassword.addEventListener("click", function () {

                const type = password.getAttribute("type") === "password" ? "text" : "password";
                const confirmtype = confirmPassword.getAttribute("type") === "password" ? "text" : "password";
                password.setAttribute("type", type);
                confirmPassword.setAttribute("type", confirmtype);

                this.classList.toggle("bi-eye");

            });

            // Validate Password
            $("#passcheck").hide();
            let passwordError = true;
            $("#password").keyup(function () {
                validatePassword();
            });
            $("#password").focusout(function () {
                validatePassword();
            });

            function validatePassword() {
                let passwordValue = $("#password").val();

                const validationRegex = [
                    { regex: /.{8,}/ }, // min 8 letters,
                    { regex: /[0-9]/ }, // numbers from 0 - 9
                    { regex: /[a-z]/ }, // letters from a - z (lowercase)
                    { regex: /[A-Z]/ }, // letters from A-Z (uppercase),
                    { regex: /[^A-Za-z0-9]/ } // special characters
                ];

                var passwordChecklist = [];

                validationRegex.forEach((item, i) => {

                    let isValid = item.regex.test(passwordValue);
                    passwordChecklist.push(isValid);

                });


                if (passwordValue.length == "") {
                    $("#passcheck").show();
                    passwordError = false;
                    return false;
                }
                if (!passwordChecklist[0]) {
                    $("#passcheck").show();
                    $("#passcheck").html(
                        "Too Short must be greater than or equal to 8!."
                    );
                    $("#passcheck").css("color", "red").css("font-size", "15px");
                    passwordError = false;
                    return false;
                }
                if (!passwordChecklist[1]) {
                    $("#passcheck").show();
                    $("#passcheck").html(
                        "must contain numbers."
                    );
                    $("#passcheck").css("color", "red").css("font-size", "15px");
                    passwordError = false;
                    return false;
                }
                if (!passwordChecklist[2]) {
                    $("#passcheck").show();
                    $("#passcheck").html(
                        "must contain small letters."
                    );
                    $("#passcheck").css("color", "red").css("font-size", "15px");
                    passwordError = false;
                    return false;
                }
                if (!passwordChecklist[3]) {
                    $("#passcheck").show();
                    $("#passcheck").html(
                        "must contain capital letter."
                    );
                    $("#passcheck").css("color", "red").css("font-size", "15px");
                    passwordError = false;
                    return false;
                }
                if (!passwordChecklist[4]) {
                    $("#passcheck").show();
                    $("#passcheck").html(
                        "must contain special character."
                    );
                    $("#passcheck").css("color", "red").css("font-size", "15px");
                    passwordError = false;
                    return false;
                }
                else {
                    $("#passcheck").hide();
                }

            }

            // Validate Confirm Password
            $("#conpasscheck").hide();
            let confirmPasswordError = true;
            $("#confirmPassword").keyup(function () {
                validateConfirmPassword();
            });

            function validateConfirmPassword() {
                let confirmPasswordValue = $("#confirmPassword").val();
                let passwordValue = $("#password").val();
                if (passwordValue != confirmPasswordValue) {
                    $("#conpasscheck").show();
                    $("#conpasscheck").html("Password didn't Match");
                    $("#conpasscheck").css("color", "red").css("font-size", "15px");;
                    confirmPasswordError = false;
                    return false;
                } else {
                    $("#conpasscheck").hide();
                }
            };

            // Submit button
            $("#submitButton").click(
                async function () {

                    button.disabled = true;
                    button.classList.add("button-loader");
                    button.removeChild(child);

                    validatePassword();
                    validateConfirmPassword();
                    if (passwordError == true && confirmPasswordError == true) {
                        let confirmPasswordValue = $("#confirmPassword").val();
                        let passwordValue = $("#password").val();

                        try {

                            var requestOptions = {
                                method: 'POST',
                                body: JSON.stringify(
                                    {
                                        password: passwordValue,
                                        confirmPassword: confirmPasswordValue,
                                    }
                                ),
                                headers: {
                                    "Content-Type": "application/json",

                                },
                                redirect: 'follow',
                                referrerPolicy: "no-referrer",
                            };


                            const response = await fetch("http://localhost:8011/v1/account/RESET_PASSWORD/bb86cfc4-ddab-513c-b7f7-5cdd8b396100", requestOptions);

                            fetchedresponse = await response.json();
                            const { user, accessToken } = fetchedresponse;

                            // window.localStorage.setItem('accessToken', accessToken);


                            button.disabled = false;
                            button.classList.remove("button-loader");
                            button.appendChild(child);

                            Swal.fire(
                                'Success!',
                                'Password Successfully change.',
                                'success'
                            );

                            window.location.replace("http://localhost:3000/");

                        } catch (e) {

                            Swal.fire(
                                'Error!',
                                'Password change failed.',
                                'error'
                            );

                            button.disabled = false;
                            button.classList.remove("button-loader");
                            button.appendChild(child);

                        }

                    } else {
                        return false;
                    }

                }

            );

        });

    </script>

                <h2 class="formTitle">
                    Password Change to your account.
                </h2>

                <div class="inputDiv">
                    <label class="inputLabel" for="password">New Password.</label>
                    <input type="password" id="password" name="password" required>
                    <i class="bi bi-eye-slash" id="togglePassword"></i>
                    <h5 id="passcheck" class="passcheck" style="font-size: 16px;">Please Fill the password.</h5>
                </div>

                <div class="inputDiv">
                    <label class="inputLabel" for="confirmPassword">Confirm Password.</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                    <h5 id="conpasscheck" class="conpasscheck" style="color: red; font-size: 16px;">
                        Password didn't match.
                    </h5>
                </div>

                <div class="buttonWrapper">
                    <button type="submit" id="submitButton" class="submitButton pure-button pure-button-primary">

                        <span id="child">Change</span>
                    </button>
                </div>
