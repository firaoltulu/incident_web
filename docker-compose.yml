version: '3'
services:
    nginx:
      restart: always
      build:
        dockerfile: Dockerfile.dev
        context: ./nginx
      ports:
        - '8080:80'
      volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      depends_on:
        - client
        - api

    client:
      build:
        dockerfile: Dockerfile.dev
        context: ./Client_ui


    api:
      build:
        dockerfile: Dockerfile.dev
        context: ./admin_server
      volumes:
        - /server/node_modules
        - ./admin_server:/server
      environment:
        - MONGO_URL=mongodb://midroc_app:${MONGO_PASSWORD}@192.168.1.174:27017/Midroc_Accident
        # - MONGO_URL=mongodb+srv://tululemma:tululemma@clusterfir.e6vva.mongodb.net/Midroc_Accident?retryWrites=true&w=majority