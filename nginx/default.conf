upstream client {
    server client:5173;   # your Vite dev port
}

upstream api {
    server api:8044;      # the port your Node server listens on
}

server {
    listen 80;

    location / {
        proxy_pass http://client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # needed for Vite HMR websocket
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /api/ {
        rewrite /api/(.*) /$1 break;   # strips /api, so /api/v1/x becomes /v1/x
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

